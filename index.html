<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾光修图 · 让每张照片更出彩</title><style>
:root{font-family:Inter,'Microsoft YaHei',system-ui,sans-serif;color:#252823;background:#f4f4f0;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.top{height:70px;background:#fff;border-bottom:1px solid #e8e9e3;display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:20px}.brand{display:flex;align-items:center;gap:11px;font-weight:750;font-size:18px;letter-spacing:.04em}.mark{width:34px;height:34px;background:#cedcbb;border-radius:10px;display:grid;place-items:center;color:#344c31;font-size:19px}.brand small{display:block;color:#a1a69a;font-size:9px;letter-spacing:.17em;margin-top:2px}.topright{display:flex;gap:10px;align-items:center}.hint{font-size:12px;color:#8d9489;margin-right:12px}.btn{border:1px solid #dddeda;background:#fff;color:#555d52;border-radius:9px;padding:10px 16px;font-size:13px;font-weight:650}.btn:hover{background:#f6f7f3}.primary{background:#334c37;color:white;border-color:#334c37}.primary:hover{background:#263d2b}.layout{display:grid;grid-template-columns:68px minmax(0,1fr) 310px;height:calc(100vh - 70px);min-height:650px}.rail{background:white;border-right:1px solid #e8e9e3;display:flex;align-items:center;flex-direction:column;padding-top:23px;gap:10px}.rail button{border:0;background:transparent;border-radius:10px;width:48px;height:53px;color:#a0a89c;font-size:19px}.rail button span{display:block;font-size:10px;margin-top:2px}.rail button.active{color:#36533c;background:#edf2e9}.workspace{display:flex;flex-direction:column;min-width:0}.workhead{display:flex;justify-content:space-between;align-items:center;padding:24px 32px 16px}.eyebrow{font-size:10px;letter-spacing:.2em;color:#9ba396;font-weight:700}.workhead h1{font-size:20px;margin:7px 0 0;letter-spacing:.02em}.filemeta{font-size:12px;color:#9a9f96}.stage-wrap{flex:1;min-height:0;padding:0 32px 20px;display:flex}.stage{background:#e8eae4;border:1px solid #e0e3db;border-radius:14px;width:100%;height:100%;min-height:360px;position:relative;overflow:hidden;display:grid;place-items:center;background-image:radial-gradient(#d7dbd1 .8px,transparent .8px);background-size:18px 18px}.empty{text-align:center;max-width:430px;padding:30px}.empty-icon{width:72px;height:72px;margin:0 auto 23px;border-radius:22px;background:#f8f9f5;display:grid;place-items:center;color:#71856c;font-size:30px;box-shadow:0 8px 26px #aeb6a22e}.empty h2{font-size:20px;margin:0 0 10px}.empty p{color:#939b8f;font-size:13px;line-height:1.8;margin:0 0 22px}.empty .btn{padding:12px 24px}.empty small{display:block;color:#adb3a9;margin-top:18px;font-size:11px}.stage.drag{outline:3px dashed #789574;outline-offset:-12px}.canvasbox{display:none;width:100%;height:100%;align-items:center;justify-content:center;padding:25px}.canvasbox canvas{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 14px 42px #303a2e32}.footer{height:58px;padding:0 32px;display:flex;justify-content:space-between;align-items:flex-start;color:#a1a89d;font-size:11px}.foot-actions{display:flex;gap:8px}.mini{border:1px solid #dedfd9;background:#fff;border-radius:7px;color:#697367;padding:7px 10px;font-size:11px}.panel{background:#fff;border-left:1px solid #e8e9e3;overflow:auto}.panel-head{padding:26px 24px 21px;border-bottom:1px solid #f0f1ed}.panel-head h2{font-size:16px;margin:5px 0 0}.panel-content{padding:22px 24px}.section-label{font-size:11px;font-weight:700;color:#9ca497;letter-spacing:.08em;margin:0 0 16px}.section{padding-bottom:24px;margin-bottom:24px;border-bottom:1px solid #eff0eb}.section:last-child{border:0}.slider-row{margin-bottom:18px}.slider-title{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:8px}.value{color:#9aa399;font-weight:400}input[type=range]{width:100%;height:4px;accent-color:#607d5e;cursor:pointer}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.filter{border:1px solid #e9ebe5;border-radius:9px;background:#fafbf8;padding:7px 5px;color:#737d6e;font-size:11px}.filter.selected{border-color:#708d6a;background:#edf3e9;color:#375336}.swatch{height:35px;display:block;border-radius:5px;margin-bottom:6px;background:linear-gradient(135deg,#d9cfad,#75977d 55%,#d1b8a0)}.filter:nth-child(2) .swatch{filter:saturate(1.3) sepia(.25)}.filter:nth-child(3) .swatch{filter:grayscale(1)}.filter:nth-child(4) .swatch{filter:sepia(.65)}.filter:nth-child(5) .swatch{filter:contrast(1.2) saturate(.65)}.filter:nth-child(6) .swatch{filter:hue-rotate(30deg) saturate(.7)}.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.tool{background:#f8f9f6;border:1px solid #eceee8;border-radius:8px;padding:11px 5px;color:#5e685a;font-size:12px}.tool:hover,.tool.selected{border-color:#91a889;background:#eff4eb}.select{width:100%;border:1px solid #e2e5de;background:#fafbf8;border-radius:8px;padding:10px;color:#5e685a;font-size:12px}.note{font-size:11px;line-height:1.7;color:#a1a89d;margin:12px 0 0}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#283c2c;color:#fff;padding:10px 18px;border-radius:8px;font-size:12px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}@media(max-width:900px){.layout{grid-template-columns:56px minmax(0,1fr) 270px}.top{padding:0 18px}.workhead{padding:20px}.stage-wrap{padding:0 20px 15px}.panel-content{padding:20px}.hint{display:none}}@media(max-width:680px){.top{height:62px}.brand small{display:none}.topright .btn{padding:9px}.layout{height:auto;min-height:0;grid-template-columns:1fr}.rail{display:none}.workhead{padding:20px 18px 13px}.stage-wrap{padding:0 14px}.stage{height:48vh;min-height:300px}.footer{height:54px;padding:12px 18px}.panel{border-left:0;border-top:1px solid #e8e9e3}.panel-head{padding:20px}.panel-content{padding:18px 20px}.filters{grid-template-columns:repeat(6,1fr)}.filter{font-size:10px}.swatch{height:27px}.section{margin-bottom:18px;padding-bottom:18px}}
</style></head><body><header class="top"><div class="brand"><div class="mark">✳</div><div>拾光修图<small>PHOTO STUDIO</small></div></div><div class="topright"><span class="hint">为每一张照片，留住好时光</span><button class="btn" id="replace">打开图片</button><button class="btn primary" id="download" disabled>↓ &nbsp;导出图片</button></div></header><main class="layout"><nav class="rail" aria-label="编辑工具"><button class="active" data-jump="adjust" title="调整">☼<span>调整</span></button><button data-jump="filterSection" title="滤镜">◈<span>滤镜</span></button><button data-jump="geometry" title="裁剪">⌗<span>裁剪</span></button></nav><section class="workspace"><div class="workhead"><div><div class="eyebrow">YOUR CREATIVE SPACE</div><h1>让照片，刚刚好。</h1></div><div class="filemeta" id="filemeta">准备开始创作</div></div><div class="stage-wrap"><div class="stage" id="stage"><div class="empty" id="empty"><div class="empty-icon">▧</div><h2>从一张照片开始</h2><p>上传图片，调整光影与色彩，<br>轻松呈现你喜欢的样子。</p><button class="btn primary" id="upload">＋ &nbsp;选择一张图片</button><small>或将图片拖放到这里 · 支持 JPG、PNG、WebP</small></div><div class="canvasbox" id="canvasbox"><canvas id="canvas"></canvas></div></div></div><div class="footer"><span id="status">✧ &nbsp; 图片仅在你的浏览器中处理</span><div class="foot-actions"><button class="mini" id="compare" disabled>按住查看原图</button><button class="mini" id="reset" disabled>↺ 重置全部</button></div></div></section><aside class="panel"><div class="panel-head"><div class="eyebrow">MAKE IT YOURS</div><h2>编辑照片</h2></div><div class="panel-content"><section class="section" id="adjust"><h3 class="section-label">基础调整 / ADJUST</h3><div id="sliders"></div></section><section class="section" id="filterSection"><h3 class="section-label">风格滤镜 / FILTER</h3><div class="filters" id="filters"></div></section><section class="section" id="geometry"><h3 class="section-label">构图 / COMPOSE</h3><div class="tools"><button class="tool" id="rotateL">↶ &nbsp;左旋转</button><button class="tool" id="rotateR">↷ &nbsp;右旋转</button><button class="tool" id="flipH">⇄ &nbsp;水平翻转</button><button class="tool" id="flipV">⇅ &nbsp;垂直翻转</button></div><p class="section-label" style="margin:20px 0 10px">裁剪比例</p><select class="select" id="ratio"><option value="original">原始比例</option><option value="1">1 : 1 正方形</option><option value="0.8">4 : 5 竖版</option><option value="1.3333333333">4 : 3 横版</option><option value="1.7777777778">16 : 9 宽屏</option><option value="0.5625">9 : 16 竖屏</option></select><p class="note">裁剪以画面中心为基准，可随时切换比例。</p></section></div></aside></main><input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden><div class="toast" id="toast"></div><script>
const $=id=>document.getElementById(id), canvas=$('canvas'), ctx=canvas.getContext('2d'); let img=null, filename='照片', angle=0, flipX=1, flipY=1, filter='原图', comparing=false; const defaults={brightness:100,contrast:100,saturate:100,blur:0};let values={...defaults};
const settings=[['brightness','亮度',0,200,100,'%'],['contrast','对比度',0,200,100,'%'],['saturate','饱和度',0,200,100,'%'],['blur','柔化',0,10,0,'px']];
$('sliders').innerHTML=settings.map(([id,label,min,max,val,unit])=>`<div class="slider-row"><div class="slider-title"><label for="${id}">${label}</label><span class="value" id="${id}Val">${val}${unit}</span></div><input id="${id}" type="range" min="${min}" max="${max}" value="${val}" ${id==='blur'?'step="0.1"':''}></div>`).join('');
const presets={'原图':'','暖阳':'sepia(.18) saturate(1.18) brightness(1.04)','黑白':'grayscale(1)','复古':'sepia(.55) contrast(.92)','电影':'contrast(1.16) saturate(.72)','清新':'hue-rotate(15deg) saturate(.82) brightness(1.06)'};$('filters').innerHTML=Object.keys(presets).map((x,i)=>`<button class="filter ${i===0?'selected':''}" data-filter="${x}"><span class="swatch"></span>${x}</button>`).join('');
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
function loadFile(file){if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)){toast('请选择 JPG、PNG 或 WebP 图片');return}const url=URL.createObjectURL(file), next=new Image();next.onload=()=>{URL.revokeObjectURL(url);img=next;filename=file.name.replace(/\.[^.]+$/,'');reset(false);$('empty').style.display='none';$('canvasbox').style.display='flex';$('download').disabled=$('reset').disabled=$('compare').disabled=false;$('filemeta').textContent=file.name+' · '+img.naturalWidth+' × '+img.naturalHeight;$('status').textContent='✧  图片仅在你的浏览器中处理';render()};next.onerror=()=>{URL.revokeObjectURL(url);toast('图片无法打开，请换一张试试')};next.src=url}
function render(){if(!img)return;const rotated=Math.abs(angle)%180===90, w=rotated?img.naturalHeight:img.naturalWidth,h=rotated?img.naturalWidth:img.naturalHeight;let cw=w,ch=h;let r=$('ratio').value;if(r!=='original'){r=Number(r);if(w/h>r)cw=Math.round(h*r);else ch=Math.round(w/r)}canvas.width=cw;canvas.height=ch;ctx.save();ctx.filter=comparing?'none':`brightness(${values.brightness}%) contrast(${values.contrast}%) saturate(${values.saturate}%) blur(${values.blur}px) ${presets[filter]}`;ctx.translate(cw/2,ch/2);ctx.scale(flipX,flipY);ctx.rotate(angle*Math.PI/180);ctx.drawImage(img,-img.naturalWidth/2,-img.naturalHeight/2);ctx.restore()}
function reset(draw=true){values={...defaults};angle=0;flipX=flipY=1;filter='原图';$('ratio').value='original';settings.forEach(([id,,,,,unit])=>{$(id).value=values[id];$(id+'Val').textContent=values[id]+unit});document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('selected',b.dataset.filter===filter));if(draw)render()}
settings.forEach(([id,,,,,unit])=>$(id).addEventListener('input',e=>{values[id]=e.target.value;$(id+'Val').textContent=e.target.value+unit;render()}));document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('selected',x===b));render()});$('upload').onclick=$('replace').onclick=()=>$('file').click();$('file').onchange=e=>{loadFile(e.target.files[0]);e.target.value=''};for(const event of ['dragenter','dragover'])$('stage').addEventListener(event,e=>{e.preventDefault();$('stage').classList.add('drag')});for(const event of ['dragleave','drop'])$('stage').addEventListener(event,e=>{e.preventDefault();$('stage').classList.remove('drag')});$('stage').addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));$('rotateL').onclick=()=>{angle-=90;render()};$('rotateR').onclick=()=>{angle+=90;render()};$('flipH').onclick=()=>{flipX*=-1;render()};$('flipV').onclick=()=>{flipY*=-1;render()};$('ratio').onchange=render;$('reset').onclick=()=>{reset();toast('已恢复原始设置')};$('compare').addEventListener('pointerdown',e=>{e.preventDefault();comparing=true;render()});for(const e of ['pointerup','pointercancel','pointerleave'])$('compare').addEventListener(e,()=>{comparing=false;render()});$('compare').addEventListener('blur',()=>{comparing=false;render()});$('download').onclick=()=>{if(!img)return;canvas.toBlob(blob=>{if(!blob){toast('导出失败，请重试');return}const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=filename+'-拾光.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)},'image/png')};document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-jump]').forEach(x=>x.classList.toggle('active',x===b));$(b.dataset.jump).scrollIntoView({behavior:'smooth',block:'start'})});
</script></body></html>
